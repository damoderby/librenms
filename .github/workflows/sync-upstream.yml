name: Sync upstream

# Fork only. Keeps master an exact copy of upstream and merges it into deploy.
# Scheduled workflows run from the default branch, so deploy must be the fork's default branch.
#
# Optional secret SYNC_TOKEN: a personal access token with contents and workflows write access.
# Without it the built-in token is used, which GitHub refuses whenever upstream changes a workflow file.

on:
  schedule:
    - cron: '17 14 * * *' # 22:17 in Perth, ahead of the nightly daily.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner != 'librenms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deploy
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Sync master and deploy with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/sync-upstream.sh
